<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة البرامج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="tv.css?v=6">
<script src="config.js?v=6"></script>

<body>
<div class="stage">
  <header class="top">
    <div class="brand"><span id="logo"></span><div class="name" id="name"></div></div>

  <main class="slides" id="slides"><div class="loading">جارٍ التحميل…</div></main>

</div>
<div class="hint" id="hint">اضغط على الشاشة للعرض بملء الشاشة</div>
