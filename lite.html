<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة البرامج</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Tajawal:400,700&amp;subset=arabic">
<style>
*{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#F6F7F7;color:#0D1010;font-family:Tajawal,Tahoma,Arial,sans-serif}
#top{position:absolute;top:0;left:0;right:0;height:10vw;background:#fff;border-bottom:.3vw solid #BA9663;padding:0 3vw}
#logos{position:absolute;right:3vw;top:1.2vw;height:7.6vw;white-space:nowrap}
#logos img{height:7.6vw;vertical-align:middle;margin-left:2vw}
#logos .sep{display:inline-block;width:.12vw;height:6vw;background:#ddd;vertical-align:middle;margin-left:2vw}
#centreName{display:inline-block;vertical-align:middle;font-size:1.9vw;font-weight:bold;color:#2C818A}
#clock{position:absolute;left:3vw;top:2vw;text-align:left;direction:ltr}
#time{font-size:3.2vw;font-weight:bold;color:#2C818A;line-height:1}
#date{font-size:1.4vw;color:#666;direction:rtl;text-align:left;margin-top:.5vw}
#stage{position:absolute;top:11.5vw;left:3vw;right:3vw;bottom:3.2vw}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;-webkit-transition:opacity .8s;transition:opacity .8s;visibility:hidden}
.slide.on{opacity:1;visibility:visible}
.head{height:7vw;line-height:7vw;white-space:nowrap}
.head .bar{display:inline-block;width:.7vw;height:4.4vw;background:#BA9663;border-radius:.4vw;vertical-align:middle;margin-left:1.4vw}
.head h1{display:inline-block;font-size:4.4vw;vertical-align:middle}
.head .n{display:inline-block;vertical-align:middle;margin-right:1.4vw;background:#2C818A;color:#fff;font-size:2.2vw;font-weight:bold;min-width:4vw;height:4vw;line-height:4vw;text-align:center;border-radius:2vw;padding:0 .8vw}
.head .pg{float:left;font-size:1.8vw;color:#888}
.tiles{position:absolute;top:8.4vw;left:0;right:0;bottom:0;font-size:0}
.tile{display:inline-block;vertical-align:top;background:#fff;border-radius:1.6vw;overflow:hidden;border-right:.7vw solid #2C818A;margin-left:2%;margin-bottom:2%;font-size:16px;box-shadow:0 .6vw 1.8vw rgba(13,16,16,.08);position:relative}
.tile .in{position:absolute;right:2.4vw;left:2.4vw;top:50%;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.tile .pl{height:6vw;margin-bottom:1vw;display:block}
.tile h2{font-weight:bold;line-height:1.35;color:#0D1010;overflow:hidden}
.tile .ow{color:#666;margin-top:.8vw}
.tile .dt{color:#2C818A;margin-top:.6vw;font-weight:bold}
.chip{display:inline-block;background:#BA9663;color:#fff;font-weight:bold;border-radius:3vw;padding:.2vw 1.2vw;margin-top:1vw}
.empty{position:absolute;top:9vw;left:0;right:0;bottom:0;border:.25vw dashed #ccc;border-radius:1.6vw;text-align:center;font-size:3vw;color:#999;padding-top:12vw}
.vid{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:50;display:none}
.vid video{width:100%;height:100%}
#dots{position:absolute;bottom:1vw;right:3vw;height:1vw}
#dots span{display:inline-block;width:1vw;height:1vw;border-radius:1vw;background:#ccc;margin-left:.6vw}
#dots span.on{width:3vw;background:#2C818A}
#msg{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:3vw;color:#888}
</style>
</head>
<body>
<div id="top">
  <div id="logos"><img id="fLogo" src="logo.svg" alt=""><span class="sep"></span><img id="cLogo" src="centre-logo.jpg" alt=""><span id="centreName" style="display:none"></span></div>
  <div id="clock"><div id="time"></div><div id="date"></div></div>
</div>
<div id="stage"><div id="msg">جارٍ التحميل…</div></div>
<div id="dots"></div>
<div class="vid" id="vid"></div>
<script src="config.js?v=3"></script>
<script>
window.onerror = function (m, u, l) { var e = document.getElementById('msg'); if (e) e.innerHTML = 'خطأ: ' + m + ' (' + l + ')'; };
(function () {
  var CFG = window.APP_CONFIG || {};
  var URL = (CFG.SUPABASE_URL || '').replace(/\/$/, ''), KEY = CFG.SUPABASE_ANON_KEY || '';
  var MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var D = { labelCurrent:'البرامج الحالية', labelUpcoming:'البرامج القادمة', labelCompleted:'البرامج المنتهية',
    slideSeconds:12, perSlide:4, showClock:true, showCountdown:true, showCompleted:false, hideEmpty:false, autoStatus:false,
    displayMode:'programs', videos:[], colorPrimary:'#2C818A', colorAccent:'#BA9663', logoUrl:'logo.svg', centreLogoUrl:'centre-logo.jpg', siteTitle:'' };
  var S = D, slides = [], idx = 0, timer = null, sig = '';

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function okUrl(u) { u = String(u || ''); return /^(https?:\/\/|data:image\/|[a-z0-9_\/.-]+\.(png|jpe?g|svg|webp|gif|mp4|webm)$)/i.test(u) ? u.replace(/^assets\//, '') : ''; }
  function merge(a, b) { var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) if (b[k] !== undefined && b[k] !== null) o[k] = b[k]; return o; }
  function get(path, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', URL + '/rest/v1/' + path, true);
    x.setRequestHeader('apikey', KEY);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) { try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); } }
      else cb(new Error('HTTP ' + x.status));
    };
    x.send();
  }
  function toD(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); d.setHours(0,0,0,0); return d; }
  function daysTo(s) { return Math.round((toD(s) - today()) / 864e5); }
  function fd(s, noYear) { var d = toD(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + (noYear ? '' : ' ' + d.getFullYear()); }
  function range(a, b) {
    if (a && b) {
      if (a.slice(0,7) === b.slice(0,7)) return toD(a).getDate() + ' – ' + fd(b);
      return fd(a, a.slice(0,4) === b.slice(0,4)) + ' – ' + fd(b);
    }
    if (a) return 'يبدأ ' + fd(a);
    if (b) return 'حتى ' + fd(b);
    return '';
  }
  function daysWord(n) { if (n === 0) return 'اليوم'; if (n === 1) return 'غداً'; if (n === 2) return 'بعد يومين'; if (n <= 10) return 'بعد ' + n + ' أيام'; return 'بعد ' + n + ' يوماً'; }
  function status(p) {
    if (!S.autoStatus) return p.status || 'upcoming';
    var t = today();
    if (p.end_date && toD(p.end_date) < t) return 'completed';
    if (p.start_date && toD(p.start_date) > t) return 'upcoming';
    if (p.start_date) return 'current';
    return p.status || 'upcoming';
  }

  function tick() {
    var n = new Date(), h = n.getHours(), m = n.getMinutes();
    $('time').innerHTML = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    $('date').innerHTML = DAYS[n.getDay()] + '، ' + n.getDate() + ' ' + MONTHS[n.getMonth()];
  }

  function load() {
    if (!URL || !KEY) { $('msg').innerHTML = 'لم يتم ربط قاعدة البيانات'; return; }
    get('settings?select=data&id=eq.1', function (e1, st) {
      get('programs?select=*&visible=eq.true&order=sort_order.asc', function (e2, pr) {
        if (e1 || e2) {
          var cached = null; try { cached = JSON.parse(localStorage.getItem('hbrc_lite')); } catch (x) {}
          if (cached && !sig) { apply(cached[0], cached[1]); }
          else if (!sig) $('msg').innerHTML = 'تعذّر الاتصال — ستتم المحاولة مجدداً';
          return;
        }
        var s = (st && st[0] && st[0].data) || {};
        var str = JSON.stringify([s, pr]);
        if (str === sig) return;
        try { localStorage.setItem('hbrc_lite', str); } catch (x) {}
        if (slides[idx] && slides[idx].type === 'video' && $('vid').style.display === 'block') { pending = [s, pr]; return; }
        apply(s, pr);
        sig = str;
      });
    });
  }
  var pending = null;

  function apply(s, pr) {
    S = merge(D, s);
    var fl = okUrl(S.logoUrl), cl = okUrl(S.centreLogoUrl);
    $('fLogo').style.display = fl ? '' : 'none'; if (fl) $('fLogo').src = fl;
    if (cl) { $('cLogo').src = cl; $('cLogo').style.display = ''; $('centreName').style.display = 'none'; }
    else { $('cLogo').style.display = 'none'; $('centreName').style.display = 'inline-block'; $('centreName').innerHTML = esc(S.siteTitle); }
    $('clock').style.display = S.showClock ? '' : 'none';
    build(pr || []);
  }

  function sortP(a, b) { return ((b.featured ? 1 : 0) - (a.featured ? 1 : 0)) || ((a.sort_order || 0) - (b.sort_order || 0)); }

  function build(P) {
    var per = Math.max(1, Math.min(6, parseInt(S.perSlide, 10) || 4)), i, j, g, list;
    var groups = [['current', S.labelCurrent], ['upcoming', S.labelUpcoming]];
    if (S.showCompleted) groups.push(['completed', S.labelCompleted]);
    slides = [];
    if (S.displayMode !== 'videos') {
      for (i = 0; i < groups.length; i++) {
        g = groups[i]; list = [];
        for (j = 0; j < P.length; j++) if (status(P[j]) === g[0]) list.push(P[j]);
        list.sort(sortP);
        if (!list.length) { if (!S.hideEmpty) slides.push({ type:'prog', key:g[0], label:g[1], items:[], n:0 }); continue; }
        var pages = Math.ceil(list.length / per);
        for (j = 0; j < pages; j++) slides.push({ type:'prog', key:g[0], label:g[1], items:list.slice(j * per, j * per + per), n:list.length, page:j + 1, pages:pages });
      }
    }
    if (S.displayMode !== 'programs') {
      var V = S.videos || [];
      for (i = 0; i < V.length; i++) if (V[i].visible !== false && V[i].kind === 'file' && okUrl(V[i].url)) slides.push({ type:'video', v:V[i] });
    }
    var html = '';
    for (i = 0; i < slides.length; i++) html += slides[i].type === 'video' ? '<div class="slide"></div>' : slideHTML(slides[i]);
    $('stage').innerHTML = html || '<div id="msg">لا يوجد محتوى للعرض</div>';
    var d = ''; if (slides.length > 1) for (i = 0; i < slides.length; i++) d += '<span></span>';
    $('dots').innerHTML = d;
    idx = 0; show(0);
  }

  // مقاسات البطاقات حسب عددها: [عرض٪، ارتفاع، حجم العنوان]
  var SZ = { 1:[98,'34vw','4.6vw'], 2:[47.9,'34vw','3.8vw'], 3:[31.3,'34vw','3vw'], 4:[47.9,'16vw','2.8vw'], 5:[31.3,'16vw','2.3vw'], 6:[31.3,'16vw','2.3vw'] };
  function slideHTML(s) {
    var h = '<div class="slide"><div class="head"><span class="bar"></span><h1>' + esc(s.label) + '</h1>' +
      (s.n ? '<span class="n">' + s.n + '</span>' : '') + (s.pages > 1 ? '<span class="pg">' + s.page + ' / ' + s.pages + '</span>' : '') + '</div>';
    if (!s.items.length) return h + '<div class="empty">لا توجد برامج حالياً</div></div>';
    var z = SZ[s.items.length] || SZ[4], t = parseFloat(z[2]);
    h += '<div class="tiles">';
    for (var i = 0; i < s.items.length; i++) {
      var p = s.items[i], pl = okUrl(p.logo_url), dt = range(p.start_date, p.end_date), chip = '';
      if (s.key === 'upcoming' && S.showCountdown && p.start_date) { var n = daysTo(p.start_date); if (n >= 0) chip = '<span class="chip" style="font-size:' + (t * .5) + 'vw">' + daysWord(n) + '</span>'; }
      h += '<div class="tile" style="width:' + z[0] + '%;height:' + z[1] + '">' +
        '<div class="in">' + (pl ? '<img class="pl" src="' + esc(pl) + '" alt="">' : '') +
        '<h2 style="font-size:' + z[2] + '">' + esc(p.title) + '</h2>' +
        (p.owner ? '<div class="ow" style="font-size:' + (t * .5) + 'vw">' + esc(p.owner) + '</div>' : '') +
        (dt ? '<div class="dt" style="font-size:' + (t * .52) + 'vw">' + esc(dt) + '</div>' : '') + chip +
        '</div></div>';
    }
    return h + '</div></div>';
  }

  function stopVideo() { var b = $('vid'); b.innerHTML = ''; b.style.display = 'none'; }
  function next() {
    if (pending) { var p = pending; pending = null; sig = JSON.stringify(p); stopVideo(); apply(p[0], p[1]); return; }
    show(idx + 1);
  }
  function show(i) {
    var els = $('stage').children; if (!slides.length) return;
    clearTimeout(timer); stopVideo();
    idx = (i + slides.length) % slides.length;
    for (var k = 0; k < els.length; k++) els[k].className = k === idx ? 'slide on' : 'slide';
    var ds = $('dots').children; for (k = 0; k < ds.length; k++) ds[k].className = k === idx ? 'on' : '';
    var s = slides[idx];
    if (s.type === 'video') {
      var b = $('vid'); b.style.display = 'block';
      b.innerHTML = '<video autoplay muted playsinline src="' + esc(okUrl(s.v.url)) + '"></video>';
      var v = b.getElementsByTagName('video')[0];
      v.onended = function () { slides.length === 1 ? show(idx) : next(); };
      v.onerror = function () { timer = setTimeout(next, 2000); };
      try { v.muted = !S.videoSound; var pr = v.play(); if (pr && pr['catch']) pr['catch'](function () { v.muted = true; v.play(); }); } catch (e) {}
      timer = setTimeout(next, 20 * 60 * 1000);
      return;
    }
    if (slides.length > 1) timer = setTimeout(next, Math.max(4, parseInt(S.slideSeconds, 10) || 12) * 1000);
  }

  tick(); setInterval(tick, 10000);
  load(); setInterval(load, 60000);
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000);
})();
</script>
</body>
</html>
