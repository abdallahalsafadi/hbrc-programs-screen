<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>رفع محتوى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css?v=17">
<script src="config.js?v=17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js?v=17"></script>
<style>
  .up-wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
  .up-head{display:flex;align-items:center;justify-content:center;gap:22px;padding:22px 0;flex-wrap:wrap}
  .up-head img{height:72px;width:auto}
  .up-head .sep{width:2px;height:56px;background:var(--line)}
  .up-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
  .up-card h1{font-size:1.45rem;color:var(--primary-dark);margin-bottom:6px}
  .up-exp{display:inline-block;background:var(--accent-soft);border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem;margin-bottom:14px}
  .or{text-align:center;color:var(--muted);margin:14px 0;font-weight:700}
  .status{margin-top:18px;font-weight:700;min-height:1.5em}
  .status .ok{color:var(--ok)} .status .er{color:var(--danger)}
  .done{text-align:center;padding:30px 10px}
  .done .big{font-size:3.2rem;color:var(--ok)}
  .filelist{margin-top:10px;font-size:.9rem;color:var(--muted)}
  .prog{display:grid;gap:10px;margin-top:6px}
  .pi{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
  .pi .top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.95rem}
  .pi .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
  .pi .bar{height:12px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:8px}
  .pi .bar i{display:block;height:100%;width:0;background:var(--primary);border-radius:99px;transition:width .3s}
  .pi.ok{border-color:var(--ok)} .pi.ok .bar i{background:var(--ok);width:100%}
  .pi.er{border-color:var(--danger)} .pi.er .bar i{background:var(--danger);width:100%}
  .pi .msg{font-size:.85rem;margin-top:6px;color:var(--muted)}
  .pi.er .msg{color:var(--danger)} .pi.ok .msg{color:var(--ok)}
  .busy-note{background:#FBF0D9;color:#8A5A00;border-radius:12px;padding:10px 14px;font-weight:700;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="up-wrap">
  <div class="up-head"><img src="logo.svg" alt=""><span class="sep"></span><img src="centre-logo.jpg" alt=""></div>
  <div class="up-card" id="card"><div class="empty">جارٍ التحقق من الرابط…</div></div>
</div>
<script>
(async function () {
  'use strict';
  const { esc, checkVideo, VIDEO_RULES_TEXT } = App;
  // عميل مستقل دائماً كزائر (حتى لو كان المشرف مسجّلاً في نفس المتصفح)
  const CFG = window.APP_CONFIG || {};
  const sb = window.supabase && CFG.SUPABASE_URL ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY,
    { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'hbrc-upload-anon' } }) : null;
  const $ = s => document.querySelector(s);
  const t = new URLSearchParams(location.search).get('t') || '';
  const card = $('#card');
  const dead = msg => { card.innerHTML = `<div class="done"><div class="big">⏱</div><h1>${msg}</h1><p class="hint">اطلب رابطاً جديداً من مشرف الشاشة.</p></div>`; };
  if (!sb || !/^[a-f0-9]{16,64}$/.test(t)) return dead('الرابط غير صالح');
  const { data: info, error } = await sb.rpc('link_info', { t });
  if (error || !info) return dead('انتهت صلاحية هذا الرابط أو أنه غير صالح');

  const exp = new Date(info.expires_at);
  const left = () => { const ms = exp - Date.now(); if (ms <= 0) return 'انتهت صلاحية الرابط'; const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4); return 'الرابط صالح لمدة ' + (d ? `${d} يوم و${h} ساعة` : h ? `${h} ساعة و${m} دقيقة` : `${m} دقيقة`); };
  const rnd = () => Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  const say = (m, cls) => { $('#st').innerHTML = `<span class="${cls || ''}">${m}</span>`; };
  const ERR = { link_expired: 'انتهت صلاحية الرابط', title_required: 'اسم البرنامج مطلوب', bad_url: 'رابط يوتيوب غير صحيح', bad_file: 'تعذّر التحقق من الملف' };
  const errMsg = e => { const m = (e && e.message) || ''; for (const k in ERR) if (m.indexOf(k) > -1) return ERR[k]; return m || 'حدث خطأ'; };
  // رفع مع شريط تقدّم (XHR)، مع بديل احتياطي عبر المكتبة
  function upload(file, folder, onProg) {
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = `inbox/${t}/${folder}-${rnd()}.${ext}`;
    const pub = () => ({ path, url: sb.storage.from('media').getPublicUrl(path).data.publicUrl });
    const viaLib = async () => {
      const { error } = await sb.storage.from('media').upload(path, file, { contentType: file.type, upsert: false });
      if (error) throw new Error(/exceeded|size|too large/i.test(error.message) ? 'الملف أكبر من الحد المسموح' : 'تعذّر رفع الملف — ' + error.message);
      if (onProg) onProg(100); return pub();
    };
    return new Promise((resolve, reject) => {
      const x = new XMLHttpRequest();
      x.open('POST', CFG.SUPABASE_URL.replace(/\/$/, '') + '/storage/v1/object/media/' + path);
      x.setRequestHeader('apikey', CFG.SUPABASE_ANON_KEY);
      x.setRequestHeader('Authorization', 'Bearer ' + CFG.SUPABASE_ANON_KEY);
      x.setRequestHeader('x-upsert', 'false');
      x.setRequestHeader('cache-control', 'max-age=31536000');
      x.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
      x.upload.onprogress = e => { if (e.lengthComputable && onProg) onProg(Math.min(99, Math.round(e.loaded / e.total * 100))); };
      x.onload = () => {
        if (x.status >= 200 && x.status < 300) { if (onProg) onProg(100); return resolve(pub()); }
        if (x.status === 413) return reject(new Error('الملف أكبر من الحد المسموح'));
        viaLib().then(resolve, reject);   // مشكلة صلاحيات/صيغة: نجرّب الطريقة البديلة
      };
      x.onerror = () => viaLib().then(resolve, reject);
      x.send(file);
    });
  }
  let busyNow = false;
  window.addEventListener('beforeunload', e => { if (busyNow) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(() => { const e = $('#exp'); if (e) e.textContent = left(); }, 30000);

  if (info.kind === 'video') {
    document.title = 'رفع فيديو — ' + info.name;
    card.innerHTML = `<h1>رفع فيديو إلى شاشة: ${esc(info.name)}</h1><span class="up-exp" id="exp">${left()}</span>
      <div class="rules"><b>شروط الفيديو</b><ul>${VIDEO_RULES_TEXT.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>
      <p class="hint">لن يظهر الفيديو على الشاشة إلا بعد موافقة المشرف.</p>
      <form id="f" class="form-grid">
        <div class="field"><label for="sender">اسمك</label><input type="text" id="sender" maxlength="120"></div>
        <div class="field"><label for="title">عنوان الفيديو (اختياري)</label><input type="text" id="title" maxlength="150"></div>
        <div class="field full"><span class="label">ملف الفيديو</span><label class="btn" for="file">اختر ملف أو عدة ملفات MP4…</label><input type="file" id="file" accept="video/mp4,.mp4" multiple hidden><div class="filelist" id="fl"></div></div>
        <div class="field full"><div class="or">— أو —</div><label for="yt">رابط يوتيوب</label><input type="url" id="yt" dir="ltr" placeholder="https://youtu.be/..."></div>
        <div class="field full"><button class="btn primary" type="submit" id="go">إرسال</button><div class="status" id="st"></div><div class="prog" id="prog"></div></div>
      </form>`;
    $('#file').addEventListener('change', e => { $('#fl').textContent = [...e.target.files].map(f => `${f.name} (${(f.size / 1048576).toFixed(1)} MB)`).join(' · '); });
    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      const files = [...$('#file').files], yt = $('#yt').value.trim(), sender = $('#sender').value.trim(), title = $('#title').value.trim();
      if (!files.length && !yt) return say('اختر ملف فيديو أو أدخل رابط يوتيوب', 'er');
      const btn = $('#go'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
      $('#f').querySelectorAll('input, label.btn').forEach(el => { el.style.pointerEvents = 'none'; el.style.opacity = '.6'; });
      busyNow = true; say('');
      const items = files.map(f => ({ name: f.name, size: f.size }));
      if (yt) items.push({ name: 'رابط يوتيوب', size: 0 });
      $('#prog').innerHTML = items.map((it, i) => `<div class="pi" id="pi${i}"><div class="top"><span class="nm">${esc(it.name)}</span><span class="pc" id="pc${i}">بالانتظار</span></div><div class="bar"><i id="pb${i}"></i></div><div class="msg" id="pm${i}">${it.size ? (it.size / 1048576).toFixed(1) + ' ميغابايت' : ''}</div></div>`).join('') + '<div class="busy-note" id="bn">⏳ جارٍ الرفع — لا تغلق الصفحة حتى تظهر علامة ✓</div>';
      $('#prog').scrollIntoView({ behavior: 'smooth', block: 'start' });
      const setP = (i, pct, txt) => { $('#pb' + i).style.width = pct + '%'; $('#pc' + i).textContent = txt || pct + '%'; };
      const setDone = (i, okk, msg) => { const el = $('#pi' + i); el.classList.add(okk ? 'ok' : 'er'); $('#pc' + i).textContent = okk ? '✓ تم' : '✕ لم يُرفع'; $('#pm' + i).textContent = msg; };
      let ok = 0; const errs = [];
      try {
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          try {
            setP(i, 0, 'جارٍ الفحص…');
            const meta = await checkVideo(f);
            if (meta && meta.lowQuality && !confirm(`«${f.name}»\n${meta.warn}\n\nهل تريد رفعه رغم ذلك؟`)) throw new Error('أُلغي الرفع — ' + meta.warn);
            setP(i, 0, '0%');
            const u = await upload(f, 'v', pct => setP(i, pct));
            setP(i, 100, 'جارٍ الحفظ…');
            const { error } = await sb.rpc('submit_video', { t, v: { kind: 'file', url: u.url, path: u.path, title: files.length > 1 ? (title ? title + ' — ' : '') + f.name.replace(/\.[^.]+$/, '') : (title || f.name.replace(/\.[^.]+$/, '')), sender } });
            if (error) throw error;
            ok++;
            setDone(i, true, meta && meta.warn ? 'تم الرفع — تنبيه: ' + meta.warn : (meta && meta.portrait ? 'تم الرفع — ملاحظة: الفيديو عمودي، يُفضّل الأفقي للشاشة' : 'تم الرفع بنجاح'));
          } catch (er) { errs.push(errMsg(er)); setDone(i, false, errMsg(er)); }
        }
        if (yt) {
          const i = files.length; setP(i, 50, 'جارٍ الإرسال…');
          const { error } = await sb.rpc('submit_video', { t, v: { kind: 'youtube', url: yt, title, sender } });
          if (error) { errs.push(errMsg(error)); setDone(i, false, errMsg(error)); } else { ok++; setDone(i, true, 'تم الإرسال'); }
        }
      } finally { busyNow = false; }
      $('#bn').remove();
      if (ok) {
        const list = $('#prog').innerHTML;
        card.innerHTML = `<div class="done"><div class="big">✓</div><h1>${errs.length ? `تم رفع ${ok} من ${items.length}` : 'اكتمل الرفع بنجاح'}</h1><p class="hint">سيظهر على الشاشة بعد موافقة المشرف.</p></div><div class="prog">${list}</div><p style="text-align:center;margin-top:18px"><a class="btn" href="${esc(location.href)}">إرسال فيديو آخر</a></p>`;
      } else {
        btn.disabled = false; btn.textContent = 'إرسال';
        $('#f').querySelectorAll('input, label.btn').forEach(el => { el.style.pointerEvents = ''; el.style.opacity = ''; });
        say('لم يُرفع أي فيديو — راجع الأسباب أعلاه وحاول مجدداً', 'er');
      }
    });
  } else {
    document.title = 'إضافة برنامج — ' + info.name;
    card.innerHTML = `<h1>إضافة برنامج إلى شاشة: ${esc(info.name)}</h1><span class="up-exp" id="exp">${left()}</span>
      <p class="hint">لن يظهر البرنامج على الشاشة إلا بعد موافقة المشرف.</p>
      <form id="f" class="form-grid">
        <div class="field full"><label for="title">اسم البرنامج *</label><input type="text" id="title" maxlength="200" required></div>
        <div class="field"><label for="owner">الشخص المسؤول</label><input type="text" id="owner" maxlength="120"></div>
        <div class="field"><label for="status">الحالة</label><select id="status"><option value="upcoming">قادم</option><option value="current">حالي</option></select></div>
        <div class="field"><label for="sd">تاريخ البدء</label><input type="date" id="sd"></div>
        <div class="field"><label for="ed">تاريخ الانتهاء</label><input type="date" id="ed"></div>
        <div class="field full"><span class="label">شعار البرنامج (اختياري — صورة حتى 5 ميغابايت)</span><label class="btn" for="logo">اختر صورة…</label><input type="file" id="logo" accept="image/*" hidden><div class="filelist" id="fl"></div></div>
        <div class="field full"><button class="btn primary" type="submit" id="go">إرسال البرنامج</button><div class="status" id="st"></div></div>
      </form>`;
    $('#logo').addEventListener('change', e => { const f = e.target.files[0]; $('#fl').textContent = f ? f.name : ''; });
    $('#f').addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('#title').value.trim(); if (!title) return say('اسم البرنامج مطلوب', 'er');
      const sd = $('#sd').value, ed = $('#ed').value;
      if (sd && ed && ed < sd) return say('تاريخ الانتهاء قبل تاريخ البدء', 'er');
      const btn = $('#go'); btn.disabled = true; btn.textContent = 'جارٍ الإرسال…'; busyNow = true;
      try {
        let logo_url = '';
        const lf = $('#logo').files[0];
        if (lf) {
          if (!lf.type.startsWith('image/')) throw new Error('الشعار يجب أن يكون صورة');
          if (lf.size > 5 * 1048576) throw new Error('الصورة أكبر من 5 ميغابايت');
          logo_url = (await upload(lf, 'logo', pct => say(`جارٍ رفع الشعار… ${pct}%`))).url;
        }
        say('جارٍ الإرسال…');
        const { error } = await sb.rpc('submit_program', { t, p: { title, owner: $('#owner').value.trim(), status: $('#status').value, start_date: sd, end_date: ed, logo_url } });
        if (error) throw error;
        card.innerHTML = `<div class="done"><div class="big">✓</div><h1>شكراً، تم إرسال البرنامج</h1><p class="hint">سيظهر على الشاشة بعد موافقة المشرف.</p><p><a class="btn" href="${esc(location.href)}">إرسال برنامج آخر</a></p></div>`;
      } catch (er) { say(esc(errMsg(er)), 'er'); }
      finally { busyNow = false; if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'إرسال البرنامج'; } }
    });
  }
})();
</script>
</body>
</html>
